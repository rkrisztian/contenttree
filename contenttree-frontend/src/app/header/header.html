<header>
  <mat-toolbar>
    <h1>Content Tree Application</h1>
    <span class="spacer"></span>

    @if (isLoading()) {
      <mat-progress-spinner diameter="24" [mode]="'indeterminate'" aria-label="Loading" />
    }

    <button mat-icon-button [matMenuTriggerFor]="pagesMenu" aria-label="Pages">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #pagesMenu="matMenu">
      <button mat-menu-item routerLink="/tree">
        <mat-icon>account_tree</mat-icon>
        <span>Tree</span>
      </button>
      <button mat-menu-item routerLink="/about">
        <mat-icon>info</mat-icon>
        <span>About</span>
      </button>
    </mat-menu>

    <button
      mat-icon-button
      [matMenuTriggerFor]="errorsMenu"
      [matBadge]="errors().length"
      [matBadgeHidden]="!errors().length"
      aria-label="Error Notifications"
    >
      <mat-icon>notifications</mat-icon>
    </button>
    <mat-menu #errorsMenu="matMenu" class="error-menu">
      @if (!errors().length) {
        <div class="empty-state">No errors</div>
      } @else {
        <ul class="error-list">
          @for (error of errors(); track error.id) {
            <li class="error-list-item">
              <app-error-card [error]="error" [closeable]="false" [hasBorder]="false" />
            </li>
          }
        </ul>
      }
    </mat-menu>

    <app-theme-toggle />
  </mat-toolbar>
</header>

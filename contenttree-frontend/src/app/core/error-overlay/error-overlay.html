@if (errorData()) {
  <mat-card>
    <mat-card-title>
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <h3 class="error-title">
        {{ errorData()!.error }}
      </h3>
      <div class="flex-spacer"></div>
      <button
        mat-icon-button
        class="error-close-button"
        aria-label="Close"
        (click)="errorService.hide()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </mat-card-title>

    <mat-card-content class="error-content">
      <div class="error-text">
        <div class="error-message">
          {{ errorData()!.message }}
        </div>
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button mat-flat-button (click)="errorService.hide()">Dismiss</button>
    </mat-card-actions>
  </mat-card>
}

sonar.projectKey=contenttree-frontend
sonar.organization=rkrisztian
sonar.projectName=contenttree-frontend
sonar.sources=src, Dockerfile
sonar.tests=src
sonar.javascript.lcov.reportPaths=coverage/lcov.info, coverage-ct/lcov.info
sonar.exclusions=**/*.spec.ts, src/test-utils/**/*.ts
sonar.test.inclusions=src/**/*.spec.ts, src/test-utils/**/*.ts
sonar.sourceEncoding=UTF-8
sonar.coverage.exclusions=src/app/api/schema.d.ts, src/environments/**/*.ts
sonar.eslint.reportPaths=eslint-report.json

sonar.issue.ignore.multicriteria=e1
# Using both version tag and digest is helpful for Dependabot upgrades.
# See https://community.sonarsource.com/t/docker-s8431-makes-dependabot-upgrades-harder-to-read-and-limits-its-features/183693
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e1.resourceKey=Dockerfile

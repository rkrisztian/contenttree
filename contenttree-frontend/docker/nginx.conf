pid                      /tmp/nginx.pid;

worker_processes         auto;
worker_rlimit_nofile     65535;  # Container must be run with e.g., `--ulimit nofile=65535:65535`

events {
  worker_connections     8192;
  multi_accept           on;
}

http {
  include                /etc/nginx/mime.types;
  default_type           application/octet-stream;

  client_body_temp_path  /tmp/client_temp;
  proxy_temp_path        /tmp/proxy_temp_path;
  fastcgi_temp_path      /tmp/fastcgi_temp;
  uwsgi_temp_path        /tmp/uwsgi_temp;
  scgi_temp_path         /tmp/scgi_temp;

  # Logging
  access_log             off;
  error_log              /dev/stderr warn;

  # Performance
  sendfile               on;
  tcp_nopush             on;
  tcp_nodelay            on;
  keepalive_timeout      65;
  keepalive_requests     1000;

  # Compression
  gzip                   on;
  gzip_vary              on;
  gzip_proxied           any;
  gzip_min_length        256;
  gzip_comp_level        6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    font/ttf
    font/otf
    image/svg+xml;

  server {
    listen               8081;
    server_name          _;  # "Catch-all" choice for an internal, non-public-facing service.

    root                 /usr/share/nginx/html;
    index                index.html;

    # Security (optional for internal nginx, but low cost to include for defense-in-depth)
    add_header           X-Frame-Options "SAMEORIGIN" always;
    add_header           X-Content-Type-Options "nosniff" always;
    add_header           X-XSS-Protection "1; mode=block" always;
    add_header           Referrer-Policy "strict-origin-when-cross-origin" always;

    # Angular Routing
    location / {
      try_files          $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
      expires            1y;
      add_header         Cache-Control "public, immutable";
    }
  }
}

version: 2
updates:
  - package-ecosystem: gradle
    directory: "/contenttree-backend"
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: "/contenttree-frontend"
    schedule:
      interval: monthly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - angular-*
          - typescript
      eslint:
        patterns:
          - "@eslint/*"
          - eslint
    allow:
      - update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "docker"
    directory: "/contenttree-frontend"
    schedule:
      interval: monthly
    registries:
      - docker-hardened-images

  - package-ecosystem: "docker-compose"
    directories:
      - "/contenttree-backend"
      - "/contenttree-deploy"
    schedule:
      interval: monthly
    registries:
      - docker-hardened-images

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

registries:
  docker-hardened-images:
    type: docker-registry
    url: https://dhi.io
    username: ${{ vars.DOCKER_USERNAME }}
    password: ${{ secrets.DOCKER_PASSWORD }}

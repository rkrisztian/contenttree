version: 2
updates:
  - package-ecosystem: gradle
    directory: "/contenttree-backend"
    schedule:
      interval: monthly
    groups:
      spring:
        patterns:
          - org.springframework.*
          - io.spring.*
      mapstruct:
        patterns:
          - org.mapstruct:*
      error-prone-and-nullaway:
        patterns:
          - net.ltgt.errorprone
          - net.ltgt.nullaway
          - com.google.errorprone:*
          - com.uber.nullaway:*

  - package-ecosystem: npm
    directories:
      - "/contenttree-frontend-angular"
      - "/contenttree-frontend-nextjs"
      - "/contenttree-deploy/e2e"
    schedule:
      interval: monthly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - angular-*
          - typescript
      eslint:
        patterns:
          - "@eslint/*"
          - eslint
      vitest:
        patterns:
          - "@vitest/*"
          - vitest-*
      testing-library:
        patterns:
          - "@testing-library/*"
          - jsdom
      i18next:
        patterns:
          - i18next
          - next-i18next
          - react-i18next
    allow:
      - update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "docker"
    directories:
      - "/contenttree-frontend-angular"
      - "/contenttree-frontend-nextjs"
    schedule:
      interval: monthly
    registries:
      - docker-hardened-images

  - package-ecosystem: "docker-compose"
    directories:
      - "/contenttree-backend"
      - "/contenttree-deploy"
    schedule:
      interval: monthly
    registries:
      - docker-hardened-images

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      docker:
        patterns:
          - "docker/*"

registries:
  docker-hardened-images:
    type: docker-registry
    url: https://dhi.io
    username: ${{ vars.DOCKER_USERNAME }}
    password: ${{ secrets.DOCKER_PASSWORD }}

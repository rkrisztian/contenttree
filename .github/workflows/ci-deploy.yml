name: CI Pipeline - Deploy (CI)

on:
  workflow_call:

jobs:
  build:
    name: Build
    defaults:
      run:
        working-directory: contenttree-deploy/e2e
    runs-on: ubuntu-latest
    steps:
      - name: (Harden Runner)
        uses: step-security/harden-runner@v2.19.4  # Immutable
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: (Set up Node.js)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: contenttree-deploy/e2e/.node_version
          cache: 'npm'
          cache-dependency-path: contenttree-deploy/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Formatting Checks
        run: npm run format:check

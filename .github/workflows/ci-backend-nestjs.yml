name: CI - Backend (NestJS)

on:
  workflow_call:

jobs:
  build:
    name: Build
    defaults:
      run:
        working-directory: contenttree-backend-nestjs
    runs-on: ubuntu-latest
    steps:
      - name: (Harden Runner)
        uses: step-security/harden-runner@v2.22.2  # Immutable
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: (Set up Node.js)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: contenttree-backend-nestjs/.node_version
          cache: 'npm'
          cache-dependency-path: contenttree-backend-nestjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Run Lint
        run: npm run lint

      - name: Analyze Imports for Cyclic Dependencies
        run: npm run lint:dpdm

      - name: Run Unit Tests
        run: npm test

      - name: (Log in to Docker Hardened Images distribution registry)
        uses: docker/login-action@v4.6.0  # Immutable
        with:
          registry: dhi.io
          # If username is sensitive for you, use a secret variable instead.
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pre-pull Postgres image
        run: |
          source .env
          docker pull "$POSTGRES_IMAGE"

      - name: Run Integration Tests
        run: npm run test:int

      - name: (Set up Docker Buildx)
        uses: docker/setup-buildx-action@v4.4.1  # Immutable

      - name: (Get Project Version)
        run: echo "PROJECT_VERSION=$(cat .version)" >> $GITHUB_ENV
        working-directory: .

      - name: SonarQube Scan
        if: ${{ ((github.event_name != 'pull_request') || (github.event.pull_request.user.login != 'dependabot[bot]')) && !cancelled() }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0  # Immutable
        with:
          projectBaseDir: contenttree-backend-nestjs
          args: >
            -Dsonar.projectVersion=${{ env.PROJECT_VERSION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: (Log in to GitHub Container Registry)
        if: ${{ (github.event_name != 'pull_request') && success() }}
        uses: docker/login-action@v4.6.0  # Immutable
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.4.0  # Immutable
        with:
          context: contenttree-backend-nestjs
          tags: "ghcr.io/${{ github.repository_owner }}/contenttree-backend-nestjs:${{ env.PROJECT_VERSION }}-snapshot"
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: true
        default: 'Manual pipeline run'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend-springboot: ${{ steps.filter.outputs.backend-springboot }}
      backend-nestjs: ${{ steps.filter.outputs.backend-nestjs }}
      frontend-angular: ${{ steps.filter.outputs.frontend-angular }}
      frontend-nextjs: ${{ steps.filter.outputs.frontend-nextjs }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: (Harden Runner)
        uses: step-security/harden-runner@v2.22.2  # Immutable
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
          disable-telemetry: true

      - name: Check out code
        if: ${{ (github.event_name != 'pull_request') && !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            backend-springboot:
              - 'contenttree-backend-springboot/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-backend-springboot.yml'
            backend-nestjs:
              - 'contenttree-backend-nestjs/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-backend-nestjs.yml'
            frontend-angular:
              - 'contenttree-frontend-angular/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-frontend-angular.yml'
            frontend-nextjs:
              - 'contenttree-frontend-nextjs/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-frontend-nextjs.yml'
            deploy:
              - 'contenttree-deploy/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-deploy.yml'

  backend-springboot:
    name: Backend (Spring Boot)
    needs: changes
    if: ${{ ((needs.changes.outputs.backend-springboot == 'true') || (github.event_name == 'workflow_dispatch')) && !cancelled() }}
    permissions:
      contents: write  # Needed by the `dependency-submission` action.
      packages: write  # Needed for publishing docker images to GHCR.
    uses: ./.github/workflows/ci-backend-springboot.yml
    secrets: inherit

  backend-nestjs:
    name: Backend (NestJS)
    needs: changes
    if: ${{ ((needs.changes.outputs.backend-nestjs == 'true') || (github.event_name == 'workflow_dispatch')) && !cancelled() }}
    permissions:
      contents: read
      packages: write  # Needed for publishing docker images to GHCR.
    uses: ./.github/workflows/ci-backend-nestjs.yml
    secrets: inherit

  frontend-angular:
    name: Frontend (Angular)
    needs: changes
    if: ${{ ((needs.changes.outputs.frontend-angular == 'true') || (github.event_name == 'workflow_dispatch')) && !cancelled() }}
    permissions:
      contents: read
      packages: write  # Needed for publishing docker images to GHCR.
    uses: ./.github/workflows/ci-frontend-angular.yml
    secrets: inherit

  frontend-nextjs:
    name: Frontend (Next.js)
    needs: changes
    if: ${{ ((needs.changes.outputs.frontend-nextjs == 'true') || (github.event_name == 'workflow_dispatch')) && !cancelled() }}
    permissions:
      contents: read
      packages: write  # Needed for publishing docker images to GHCR.
    uses: ./.github/workflows/ci-frontend-nextjs.yml
    secrets: inherit

  deploy-ci:
    name: Deploy (CI)
    needs: changes
    if: ${{ ((needs.changes.outputs.deploy == 'true') || (github.event_name == 'workflow_dispatch')) && !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci-deploy.yml
    secrets: inherit

  dependency-review:
    name: "(PR) Dependency Review"
    needs: [ backend-springboot, backend-nestjs, frontend-angular, frontend-nextjs, deploy-ci ]
    if: ${{ (github.event_name == 'pull_request') && (github.event.pull_request.user.login != 'dependabot[bot]') && !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci-pr-dependency-review.yml
    secrets: inherit

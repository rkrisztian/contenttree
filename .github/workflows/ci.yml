name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out code
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v6

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            backend:
              - 'contenttree-backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'contenttree-frontend/**'
              - '.github/workflows/ci.yml'

  build-backend:
    name: Build Backend (Spring Boot)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: contenttree-backend
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed by the " dependency-submission" action
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version-file: 'contenttree-backend/.java-version'
          distribution: 'temurin'

      - name: Cache .gradle
        uses: burrunan/gradle-cache-action@4b67497abd37a511d6c1dc6299bdd84ff39f7bf5  # v3.0.2
        with:
          read-only: ${{ github.ref != 'refs/heads/main' }}
          build-root-directory: contenttree-backend

      - name: Log in to Docker Hardened Images distribution registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: dhi.io
          # If username is sensitive for you, use a secret variable instead.
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend
        run: ./gradlew build

      - name: Build Docker Image
        run: ./gradlew bootBuildImage

      - name: Generate and submit dependency graph
        if: ${{ github.event_name != 'pull_request' }}
        uses: gradle/actions/dependency-submission@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e  # v6.1.0
        with:
          dependency-graph: generate-and-submit
          build-root-directory: contenttree-backend

      - name: SonarQubeCloud Scan
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-frontend:
    name: Build Frontend (Angular)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: contenttree-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: contenttree-frontend/.node_version
          cache: 'npm'
          cache-dependency-path: contenttree-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Run Lint
        run: npm run lint

      # ESLint does not support multiple reporter formats in one go.
      # See: https://github.com/eslint/eslint/issues/19990
      - name: (Generate ESLint report for Sonar)
        run: npm run lint:sonar

      - name: Run Unit Tests
        run: npm test

      - name: Install Playwright Browser
        run: npx playwright install chromium

      - name: Run Component Tests
        run: npm run test:ct

      - name: Log in to Docker Hardened Images distribution registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: dhi.io
          # If username is sensitive for you, use a secret variable instead.
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: npm run docker:build --ignore-scripts

      # Project version is not picked up automatically.
      # See: https://github.com/bellingard/sonar-scanner-npm/issues/75
      - name: (Get Frontend Version for SonarQube Scan)
        id: get-frontend-version
        run: echo "version=$(node -pe "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995  # v8.1.0
        with:
          projectBaseDir: contenttree-frontend
          args: >
            -Dsonar.projectVersion=${{ steps.get-frontend-version.outputs.version }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: (Harden Runner)
        uses: step-security/harden-runner@v2.19.4  # Immutable
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out code
        if: ${{ (github.event_name != 'pull_request') && !cancelled() }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            backend:
              - 'contenttree-backend/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-backend.yml'
            frontend:
              - 'contenttree-frontend/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-frontend.yml'

  backend:
    name: Backend
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true') && !cancelled()  }}
    permissions:
      contents: write  # Needed by the `dependency-submission` action.
      packages: write  # Needed for publishing docker images to GHCR.
    uses: ./.github/workflows/ci-backend.yml
    secrets: inherit

  frontend:
    name: Frontend
    needs: changes
    if: ${{ (needs.changes.outputs.frontend == 'true') && !cancelled()  }}
    permissions:
      contents: read
      packages: write  # Needed for publishing docker images to GHCR.
    uses: ./.github/workflows/ci-frontend.yml
    secrets: inherit

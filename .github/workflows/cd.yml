name: CD Pipeline

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  deploy-and-e2e-test:
    name: Deploy and E2E Test
    defaults:
      run:
        working-directory: contenttree-deploy/e2e
    runs-on: ubuntu-latest
    permissions:
      packages: write
    timeout-minutes: 60
    steps:
      - name: (Harden Runner)
        uses: step-security/harden-runner@v2.19.4  # Immutable
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: (Get Project Version)
        run: echo "PROJECT_VERSION=$(cat .version)" >> $GITHUB_ENV
        working-directory: .

      - name: (Log in to Docker Hardened Images distribution registry)
        uses: docker/login-action@v4.5.1  # Immutable
        with:
          registry: dhi.io
          # If username is sensitive for you, use a secret variable instead.
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: (Create Docker Secret Files)
        run: |
          cat >etc/db/username <<'EOF'
          ${{ secrets.DB_USERNAME }}
          EOF

          cat >etc/db/password <<'EOF'
          ${{ secrets.DB_PASSWORD }}
          EOF

          cat >etc/backend/application.properties <<'EOF'
          spring.datasource.username=${{ secrets.DB_USERNAME }}
          spring.datasource.password=${{ secrets.DB_PASSWORD }}
          app.jwt.secret=${{ secrets.JWT_SECRET }}
          EOF

          cat >etc/backend/prod_data.sql <<'EOF'
          -- Prod-like data initialization script (used for E2E testing)
          DO
          '
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM users WHERE name = ''admin'') THEN
              INSERT INTO users (id, name, password_hash, role) VALUES
                (1, ''admin'', ''${{ secrets.ADMIN_PASSWORD_HASHED }}'', ''ADMIN'');

              PERFORM setval(''public.users_seq'', (SELECT COALESCE(MAX(id), 1) FROM users));
            END IF;
          END;
          '  LANGUAGE PLPGSQL;
          EOF
        working-directory: contenttree-deploy

      - name: Deploy Application
        uses: hoverkraft-tech/compose-action@11beaa1c2dae4e8ed7b1665aa074723b6cecb0e4  # v3.0.0
        with:
          compose-file: compose.yaml
          up-flags: '--wait'
          down-flags: '--volumes'
          cwd: contenttree-deploy
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/contenttree-backend:${{ env.PROJECT_VERSION }}-snapshot
          FRONTEND_ANGULAR_IMAGE: ghcr.io/${{ github.repository_owner }}/contenttree-frontend-angular:${{ env.PROJECT_VERSION }}-snapshot
          FRONTEND_NEXTJS_IMAGE: ghcr.io/${{ github.repository_owner }}/contenttree-frontend-nextjs:${{ env.PROJECT_VERSION }}-snapshot

      - name: (Set up Node.js)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: contenttree-deploy/e2e/.node_version
          cache: 'npm'
          cache-dependency-path: contenttree-deploy/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browser (Chromium)
        run: npm run install:chromium

      - name: Run E2E Tests
        run: npm test
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: (Upload E2E Test Report)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: contenttree-deploy/e2e/playwright-report/
          retention-days: 30

      - name: (Log in to GitHub Container Registry)
        uses: docker/login-action@v4.5.1  # Immutable
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Release Candidate Images
        run: |
          docker tag ${BACKEND_IMAGE_OLD} ${BACKEND_IMAGE_NEW}
          docker tag ${FRONTEND_ANGULAR_IMAGE_OLD} ${FRONTEND_ANGULAR_IMAGE_NEW}
          docker tag ${FRONTEND_NEXTJS_IMAGE_OLD} ${FRONTEND_NEXTJS_IMAGE_NEW}
          docker push ${BACKEND_IMAGE_NEW}
          docker push ${FRONTEND_ANGULAR_IMAGE_NEW}
          docker push ${FRONTEND_NEXTJS_IMAGE_NEW}
        env:
          BACKEND_IMAGE_OLD: ghcr.io/${{ github.repository_owner }}/contenttree-backend:${{ env.PROJECT_VERSION }}-snapshot
          BACKEND_IMAGE_NEW: ghcr.io/${{ github.repository_owner }}/contenttree-backend:${{ env.PROJECT_VERSION }}-rc
          FRONTEND_ANGULAR_IMAGE_OLD: ghcr.io/${{ github.repository_owner }}/contenttree-frontend-angular:${{ env.PROJECT_VERSION }}-snapshot
          FRONTEND_ANGULAR_IMAGE_NEW: ghcr.io/${{ github.repository_owner }}/contenttree-frontend-angular:${{ env.PROJECT_VERSION }}-rc
          FRONTEND_NEXTJS_IMAGE_OLD: ghcr.io/${{ github.repository_owner }}/contenttree-frontend-nextjs:${{ env.PROJECT_VERSION }}-snapshot
          FRONTEND_NEXTJS_IMAGE_NEW: ghcr.io/${{ github.repository_owner }}/contenttree-frontend-nextjs:${{ env.PROJECT_VERSION }}-rc

  release:
    name: Release
    needs: deploy-and-e2e-test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    environment: release
    steps:
      - name: (Harden Runner)
        uses: step-security/harden-runner@v2.19.4  # Immutable
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: (Get Project Version)
        run: echo "PROJECT_VERSION=$(cat .version)" >> $GITHUB_ENV

      - name: (Log in to GitHub Container Registry)
        uses: docker/login-action@v4.5.1  # Immutable
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Release Images
        run: |
          docker pull ${BACKEND_IMAGE_OLD}
          docker pull ${FRONTEND_ANGULAR_IMAGE_OLD}
          docker pull ${FRONTEND_NEXTJS_IMAGE_OLD}
          docker tag ${BACKEND_IMAGE_OLD} ${BACKEND_IMAGE_NEW}
          docker tag ${FRONTEND_ANGULAR_IMAGE_OLD} ${FRONTEND_ANGULAR_IMAGE_NEW}
          docker tag ${FRONTEND_NEXTJS_IMAGE_OLD} ${FRONTEND_NEXTJS_IMAGE_NEW}
          docker push ${BACKEND_IMAGE_NEW}
          docker push ${FRONTEND_ANGULAR_IMAGE_NEW}
          docker push ${FRONTEND_NEXTJS_IMAGE_NEW}
        env:
          BACKEND_IMAGE_OLD: ghcr.io/${{ github.repository_owner }}/contenttree-backend:${{ env.PROJECT_VERSION }}-rc
          BACKEND_IMAGE_NEW: ghcr.io/${{ github.repository_owner }}/contenttree-backend:${{ env.PROJECT_VERSION }}
          FRONTEND_ANGULAR_IMAGE_OLD: ghcr.io/${{ github.repository_owner }}/contenttree-frontend-angular:${{ env.PROJECT_VERSION }}-rc
          FRONTEND_ANGULAR_IMAGE_NEW: ghcr.io/${{ github.repository_owner }}/contenttree-frontend-angular:${{ env.PROJECT_VERSION }}
          FRONTEND_NEXTJS_IMAGE_OLD: ghcr.io/${{ github.repository_owner }}/contenttree-frontend-nextjs:${{ env.PROJECT_VERSION }}-rc
          FRONTEND_NEXTJS_IMAGE_NEW: ghcr.io/${{ github.repository_owner }}/contenttree-frontend-nextjs:${{ env.PROJECT_VERSION }}

      - name: Create Git Tag
        uses: pkgdeps/git-tag-action@a5a161774bace8b4e1969dd850c67a7421f1b710  # v3.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          git_commit_sha: ${{ github.sha }}
          version: ${{ env.PROJECT_VERSION }}
          git_tag_prefix: 'v'

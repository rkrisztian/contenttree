name: CD Pipeline

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  deploy-and-e2e-test:
    name: Deploy and E2E Test
    defaults:
      run:
        working-directory: contenttree-deploy/e2e
    runs-on: ubuntu-latest
    permissions:
      packages: write
    timeout-minutes: 60
    steps:
      - name: (Harden Runner)
        uses: step-security/harden-runner@v2.19.4  # Immutable
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: (Get Project Version)
        run: echo "PROJECT_VERSION=$(cat .version)" >> $GITHUB_ENV
        working-directory: .

      - name: (Log in to Docker Hardened Images distribution registry)
        uses: docker/login-action@v4.2.0  # Immutable
        with:
          registry: dhi.io
          # If username is sensitive for you, use a secret variable instead.
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy Application
        uses: hoverkraft-tech/compose-action@11beaa1c2dae4e8ed7b1665aa074723b6cecb0e4  # v3.0.0
        with:
          compose-file: compose.yaml
          down-flags: "--volumes"
          cwd: contenttree-deploy
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/contenttree-backend:${{ env.PROJECT_VERSION }}-snapshot
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/contenttree-frontend:${{ env.PROJECT_VERSION }}-snapshot
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: (Set up Node.js)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: contenttree-deploy/e2e/.node_version
          cache: 'npm'
          cache-dependency-path: contenttree-deploy/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browser (Chromium)
        run: npm run install:chromium

      - name: Run E2E Tests
        run: npm test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: contenttree-deploy/e2e/playwright-report/
          retention-days: 30

      - name: (Log in to GitHub Container Registry)
        uses: docker/login-action@v4.2.0  # Immutable
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Release Candidate Images
        run: |
          docker tag ${BACKEND_IMAGE_OLD} ${BACKEND_IMAGE_NEW}
          docker tag ${FRONTEND_IMAGE_OLD} ${FRONTEND_IMAGE_NEW}
          docker push ${BACKEND_IMAGE_NEW}
          docker push ${FRONTEND_IMAGE_NEW}
        env:
          BACKEND_IMAGE_OLD: ghcr.io/${{ github.repository_owner }}/contenttree-backend:${{ env.PROJECT_VERSION }}-snapshot
          BACKEND_IMAGE_NEW: ghcr.io/${{ github.repository_owner }}/contenttree-backend:${{ env.PROJECT_VERSION }}-rc
          FRONTEND_IMAGE_OLD: ghcr.io/${{ github.repository_owner }}/contenttree-frontend:${{ env.PROJECT_VERSION }}-snapshot
          FRONTEND_IMAGE_NEW: ghcr.io/${{ github.repository_owner }}/contenttree-frontend:${{ env.PROJECT_VERSION }}-rc

  release:
    name: Release
    needs: deploy-and-e2e-test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    environment: release
    steps:
      - name: (Harden Runner)
        uses: step-security/harden-runner@v2.19.4  # Immutable
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: (Get Project Version)
        run: echo "PROJECT_VERSION=$(cat .version)" >> $GITHUB_ENV

      - name: (Log in to GitHub Container Registry)
        uses: docker/login-action@v4.2.0  # Immutable
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Release Images
        run: |
          docker pull ${BACKEND_IMAGE_OLD}
          docker pull ${FRONTEND_IMAGE_OLD}
          docker tag ${BACKEND_IMAGE_OLD} ${BACKEND_IMAGE_NEW}
          docker tag ${FRONTEND_IMAGE_OLD} ${FRONTEND_IMAGE_NEW}
          docker push ${BACKEND_IMAGE_NEW}
          docker push ${FRONTEND_IMAGE_NEW}
        env:
          BACKEND_IMAGE_OLD: ghcr.io/${{ github.repository_owner }}/contenttree-backend:${{ env.PROJECT_VERSION }}-rc
          BACKEND_IMAGE_NEW: ghcr.io/${{ github.repository_owner }}/contenttree-backend:${{ env.PROJECT_VERSION }}
          FRONTEND_IMAGE_OLD: ghcr.io/${{ github.repository_owner }}/contenttree-frontend:${{ env.PROJECT_VERSION }}-rc
          FRONTEND_IMAGE_NEW: ghcr.io/${{ github.repository_owner }}/contenttree-frontend:${{ env.PROJECT_VERSION }}

      - name: Create Git Tag
        uses: pkgdeps/git-tag-action@a5a161774bace8b4e1969dd850c67a7421f1b710  # v3.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          git_commit_sha: ${{ github.sha }}
          version: ${{ env.PROJECT_VERSION }}
          git_tag_prefix: "v"

name: CI Pipeline - Frontend (Next.js)

on:
  workflow_call:

jobs:
  build:
    name: Build
    defaults:
      run:
        working-directory: contenttree-frontend-nextjs
    runs-on: ubuntu-latest
    steps:
      - name: (Harden Runner)
        uses: step-security/harden-runner@v2.20.0  # Immutable
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: (Set up Node.js)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: contenttree-frontend-nextjs/.node_version
          cache: 'npm'
          cache-dependency-path: contenttree-frontend-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Run Lint
        run: npm run lint:ci

      - name: Analyze Imports for Cyclic Dependencies
        run: npm run lint:dpdm

      - name: Run Unit Tests
        run: npm test

      - name: Install Playwright Browser (Chromium)
        run: npm run install:chromium

      - name: Run Component Tests
        run: npm run test:ct

      - name: (Log in to Docker Hardened Images distribution registry)
        uses: docker/login-action@v4.5.1  # Immutable
        with:
          registry: dhi.io
          # If username is sensitive for you, use a secret variable instead.
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: (Set up Docker Buildx)
        uses: docker/setup-buildx-action@v4.2.0  # Immutable

      - name: (Get Project Version)
        run: echo "PROJECT_VERSION=$(cat .version)" >> $GITHUB_ENV
        working-directory: .

      - name: SonarQube Scan
        if: ${{ ((github.event_name != 'pull_request') || (github.event.pull_request.user.login != 'dependabot[bot]')) && !cancelled() }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1  # Immutable
        with:
          projectBaseDir: contenttree-frontend-nextjs
          args: >
            -Dsonar.projectVersion=${{ env.PROJECT_VERSION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: (Log in to GitHub Container Registry)
        if: ${{ (github.event_name != 'pull_request') && success() }}
        uses: docker/login-action@v4.5.1  # Immutable
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.3.0  # Immutable
        with:
          context: contenttree-frontend-nextjs
          tags: "ghcr.io/${{ github.repository_owner }}/contenttree-frontend-nextjs:${{ env.PROJECT_VERSION }}-snapshot"
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

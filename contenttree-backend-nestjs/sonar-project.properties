sonar.projectKey=contenttree-backend-nestjs
sonar.organization=rkrisztian
sonar.projectName=contenttree-backend-nestjs
sonar.sources=src, Dockerfile
sonar.tests=src
sonar.javascript.lcov.reportPaths=coverage/lcov.info, coverage-int/lcov.info
sonar.exclusions=**/*.spec.ts, src/**/*.int-spec.ts, src/test-utils/**/*.ts
sonar.test.inclusions=src/**/*.spec.ts, src/**/*.int-spec.ts, src/test-utils/**/*.ts, src/migrations/*test*
sonar.sourceEncoding=UTF-8
sonar.coverage.exclusions=src/main.ts, src/**/*.module.ts

sonar.issue.ignore.multicriteria=e1,e2,e3,e4
# Using both version tag and digest is helpful for Dependabot upgrades.
# See https://community.sonarsource.com/t/docker-s8431-makes-dependabot-upgrades-harder-to-read-and-limits-its-features/183693
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e1.resourceKey=Dockerfile
# We can use `--strict-allow-scripts` instead of `--ignore-scripts`.
# See https://community.sonarsource.com/t/docker-s6505-is-outdated-and-too-extreme/190499
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S6505
sonar.issue.ignore.multicriteria.e2.resourceKey=Dockerfile
# Too many false positives with async functions without await.
# See https://community.sonarsource.com/t/typescript-s7503-has-false-positives-wanting-await-keyword/189434
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.e3.resourceKey=src/**/*.ts
# Test data is safe to be committed.
sonar.issue.ignore.multicriteria.e3.ruleKey=secrets:S8215
sonar.issue.ignore.multicriteria.e3.resourceKey=src/migrations/*test*

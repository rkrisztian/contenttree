[versions]
mapstruct = "1.6.3"
pmd = "7.22.0"
jjwt = "0.13.0"

[plugins]
springframeworkBoot = { id = "org.springframework.boot", version = "4.1.0" }
springDependencyManagement = { id = "io.spring.dependency-management", version = "1.1.7" }
openapiGradlePlugin = { id = "org.springdoc.openapi-gradle-plugin", version = "1.9.0" }
netLtgt-errorprone = { id = "net.ltgt.errorprone", version = "5.1.0" }
netLtgt-nullaway = { id = "net.ltgt.nullaway", version = "3.1.0" }
sonarqube = { id = "org.sonarqube", version = "7.3.1.8318" }

[libraries]
springdocOpenapiStarterWebmvcUi = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version = "3.1.0" }
mapstruct = { group = "org.mapstruct", name = "mapstruct", version.ref = "mapstruct" }
mapstructProcessor = { group = "org.mapstruct", name = "mapstruct-processor", version.ref = "mapstruct" }
errorProneCore = { group = "com.google.errorprone", name = "error_prone_core", version = "2.50.0" }
nullaway = { group = "com.uber.nullaway", name = "nullaway", version = "0.13.8" }
jjwtApi = { group = "io.jsonwebtoken", name = "jjwt-api", version = "0.13.0" }
jjwtImpl = { group = "io.jsonwebtoken", name = "jjwt-impl", version = "0.13.0" }
jjwtJackson = { group = "io.jsonwebtoken", name = "jjwt-jackson", version = "0.13.0" }

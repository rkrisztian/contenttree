services:
  db:
    # see `.env` file
    image: ${POSTGRES_IMAGE}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: contenttree
    networks:
      - db-network

  # Optional: A DB manager tool you can use if you don't have IntelliJ IDEA Ultimate subscription
  dbgate:
    profiles: [ debug ]
    # version: 7.1.13-alpine
    image: dbgate/dbgate@sha256:96756007e30fec85ec63fc076ec8e3a551e882f6963bc24a8974ea344ac1b440
    ports:
      - "5433:3000"
    environment:
      CONNECTIONS: pg

      LABEL_pg: content-tree-db
      SERVER_pg: db
      USER_pg: postgres
      PASSWORD_pg: secret
      PORT_pg: 5432
      ENGINE_pg: postgres@dbgate-plugin-postgres
    networks:
      - db-network

volumes:
  db-data:
    driver:
      local

networks:
  db-network:
    driver: bridge

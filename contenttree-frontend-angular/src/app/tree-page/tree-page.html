<div class="page-layout" *translateBlock="let t">
  <mat-card appearance="outlined" class="tree-panel">
    <mat-card-header>
      <app-tree-toolbar />
    </mat-card-header>

    <mat-divider />

    <mat-card-content #treeContainer class="tree">
      @if (rawNodes.isLoading()) {
        <div class="loading-container">
          <mat-spinner diameter="32"></mat-spinner>
          <span>{{ t('tree-page.tree.loading-indicator') }}</span>
        </div>
      } @else if (treeData().rootNodeId == null) {
        <div class="empty-state">
          <mat-icon class="empty-icon">inbox</mat-icon>
          <h3>{{ t('tree-page.tree.tree-is-empty') }}</h3>
          <p>{{ t('tree-page.tree.add-root-node-text') }}</p>
        </div>
      } @else {
        <app-tree />
      }
    </mat-card-content>
  </mat-card>

  <app-content-panel />
</div>

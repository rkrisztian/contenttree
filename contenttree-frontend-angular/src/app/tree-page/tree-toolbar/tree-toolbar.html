<div class="toolbar-container" *translateBlock="let t">
  <div class="toolbar-search-row">
    <mat-form-field class="search-field" appearance="outline">
      <mat-icon matPrefix>search</mat-icon>
      <mat-label>{{ t('tree-page.toolbar.search-field-label') }}</mat-label>
      <!-- //NOSONAR Web:InputWithoutLabelCheck: label is generated by mat_label --><input
        type="search"
        matInput
        [formField]="searchForm.searchText"
      />
      @if (searchForm.searchText().value()) {
        <button
          class="clear-search-button"
          matSuffix
          mat-icon-button
          (click)="searchForm.searchText().value.set('')"
          [attr.aria-label]="t('tree-page.toolbar.search-field-clear-button-aria-label')"
        >
          <mat-icon>close</mat-icon>
        </button>
      }
      @if (searchForm.searchText().touched() && searchForm.searchText().invalid()) {
        @for (error of searchForm.searchText().errors(); track error) {
          <mat-error>
            {{ error.message }}
          </mat-error>
        }
      }
    </mat-form-field>
  </div>

  <div class="toolbar-button-row">
    <button
      mat-flat-button
      (click)="addOrEditNode(true)"
      [disabled]="!isManager() || (!!treeData().rootNodeId && !selectedNodeId()) || isLoading()"
      [attr.aria-label]="t('tree-page.toolbar.add-new-node-button-aria-label')"
    >
      <mat-icon>add</mat-icon>
      {{ t('tree-page.toolbar.add-new-node-button-label') }}
    </button>

    <button
      mat-flat-button
      (click)="addOrEditNode(false)"
      [disabled]="!isManager() || !selectedNodeId() || isLoading()"
      [attr.aria-label]="t('tree-page.toolbar.edit-selected-node-button-aria-label')"
    >
      <mat-icon>edit</mat-icon>
      {{ t('tree-page.toolbar.edit-selected-node-button-label') }}
    </button>

    <button
      mat-flat-button
      class="delete-button"
      (click)="deleteNode()"
      [disabled]="
        !isManager() ||
        !selectedNodeId() ||
        selectedNodeId() === treeData().rootNodeId ||
        isLoading()
      "
      [attr.aria-label]="t('tree-page.toolbar.delete-selected-node-button-aria-label')"
    >
      <mat-icon>delete</mat-icon>
      {{ t('tree-page.toolbar.delete-selected-node-button-label') }}
    </button>
  </div>
</div>

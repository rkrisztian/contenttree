<header *translateBlock="let t">
  <mat-toolbar>
    <h1>{{ t('app.header-title') }}</h1>
    <span class="spacer"></span>

    @if (isLoading()) {
      <mat-progress-spinner diameter="24" [mode]="'indeterminate'" aria-label="Loading" />
    }

    <button mat-icon-button [matMenuTriggerFor]="pagesMenu" aria-label="Pages">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #pagesMenu="matMenu">
      <button mat-menu-item routerLink="/tree">
        <mat-icon>account_tree</mat-icon>
        <span>Tree</span>
      </button>
      <button mat-menu-item routerLink="/about">
        <mat-icon>info</mat-icon>
        <span>About</span>
      </button>
    </mat-menu>

    <button
      mat-icon-button
      [matMenuTriggerFor]="errorsMenu"
      [matBadge]="errors().length"
      [matBadgeHidden]="!errors().length"
      [attr.aria-label]="errorNotificationsAriaLabel(errors().length)"
    >
      <mat-icon>notifications</mat-icon>
    </button>
    <mat-menu #errorsMenu="matMenu" class="error-menu">
      @if (!errors().length) {
        <div class="empty-state">No errors</div>
      } @else {
        <div (click)="$event.stopPropagation()" (keypress)="$event.stopPropagation()" tabindex="-1">
          <ul class="error-list">
            @for (error of errors(); track error.id) {
              <li class="error-list-item">
                <app-error-card [error]="error" [closeable]="false" [hasBorder]="false" />
              </li>
            }
          </ul>
        </div>
      }
    </mat-menu>

    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu" class="user-menu">
      @if (isAuthenticated()) {
        <div class="username">{{ currentUsername() }}</div>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Log Out</span>
        </button>
      } @else {
        <button mat-menu-item (click)="login()">
          <mat-icon>login</mat-icon>
          <span>Log In</span>
        </button>
      }
    </mat-menu>

    <app-theme-toggle />

    <app-language-toggle />
  </mat-toolbar>
</header>
